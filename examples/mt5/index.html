<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeCanvas · MetaTrader 5</title>
  <link rel="stylesheet" href="/order-ticket.css">
  <style>
    :root { color-scheme: dark; font: 14px Inter, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #e6eaf0; background: #0c1016; }
    main { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 18px;
      padding: 9px 13px; border-bottom: 1px solid #2a3342; }
    h1 { margin: 0; font-size: 14px; font-weight: 650; }
    #sessions-dialog button, #sessions-form input, #sessions-form select { font: inherit; color: inherit; }
    #sessions-dialog button { cursor: pointer; border: 1px solid #48586d; border-radius: 5px;
      background: #1c2735; padding: 5px 9px; }
    #sessions-dialog button:hover { background: #25364b; }
    #status { color: #adbbcf; }
    #status[data-connected="true"] { color: #79d7b7; }
    #sessions-alert { color: #f5c478; }
    #chart { min-width: 0; min-height: 0; }
    #chart .tcw-grid-layout-btn::after { content: 'Chia biểu đồ'; }
    #chart .tcw-grid-layout-btn > svg:last-of-type { order: 1; }
    #chart [data-pane-axis-scale] { cursor: ns-resize !important; }
    #sessions-dialog { width: min(680px, calc(100vw - 28px)); max-height: min(760px, 90dvh);
      color: #e6eaf0; background: #141c27; border: 1px solid #48586d; border-radius: 10px; padding: 16px; }
    #sessions-dialog::backdrop { background: #070b13b5; }
    #sessions-dialog h2 { font-size: 17px; margin: 0 0 14px; }
    #sessions-dialog p { margin: 11px 0; color: #adbbcf; }
    #sessions-dialog details { border: 1px solid #344153; border-radius: 5px; padding: 7px 10px; min-width: 0; }
    #sessions-dialog summary { cursor: pointer; }
    #sessions-form { display: grid; gap: 8px; }
    #sessions-form details > div { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(158px, 100%), 1fr));
      align-items: center; gap: 9px 12px; margin-top: 9px; }
    #sessions-form details details { grid-column: 1 / -1; }
    #sessions-form .sessions-fibo-level { grid-column: 1 / -1; display: grid;
      grid-template-columns: 1fr 1fr; gap: 12px; }
    #sessions-form .sessions-fibo-shortcuts { grid-column: 1 / -1; display: flex; gap: 8px; }
    #sessions-form .sessions-season-hint { grid-column: 1 / -1; color: #adbbcf; line-height: 1.5; }
    #sessions-form .sessions-season-hours { grid-column: 1 / -1; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 12px; }
    #sessions-form .sessions-season-hours fieldset { min-width: 0; margin: 0; padding: 8px;
      border: 1px solid #344153; border-radius: 4px; }
    #sessions-form .sessions-season-hours legend { padding: 0 4px; color: #adbbcf; }
    #sessions-form .sessions-season-hours label + label { margin-top: 8px; }
    #sessions-form label { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
    #sessions-form input, #sessions-form select { background: #0f151f; border: 1px solid #3a485a;
      border-radius: 4px; padding: 3px; min-width: 0; max-width: 55%; }
    #sessions-form input[type="color"] { width: 38px; }
    #sessions-form input[type="number"] { width: 54px; }
    #sessions-dialog footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    header > button, .mt5-dialog button { cursor: pointer; font: inherit; color: inherit;
      border: 1px solid #48586d; border-radius: 5px; background: #1c2735; padding: 5px 9px; }
    button:disabled { opacity: .55; cursor: wait; }
    #mt5-trading-status { font-size: 12px; color: #adbbcf; }
    .mt5-dialog { width: min(680px, calc(100vw - 28px)); max-height: 90dvh; overflow: auto;
      color: #e6eaf0; background: #141c27; border: 1px solid #48586d; border-radius: 10px; padding: 18px; }
    .mt5-dialog::backdrop { background: #070b13b5; }
    .mt5-dialog h2 { margin-top: 0; font-size: 18px; }
    .mt5-dialog p { white-space: pre-line; line-height: 1.7; }
    .mt5-dialog button { margin: 4px; }
    .mt5-dialog input, .mt5-dialog select { padding: 8px; color: inherit; background: #0e151f;
      border: 1px solid #48586d; border-radius: 4px; font: inherit; min-width: 0; }
    .mt5-fields { display: grid; gap: 12px; }
    .mt5-fields label { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 12px; }
    .mt5-warning { color: #f5c478; }
    #mt5-account { width: min(1180px, calc(100vw - 28px)); }
    #mt5-account table { width: 100%; font-size: 13px; border-collapse: collapse; }
    #mt5-account th, #mt5-account td { text-align: left; padding: 8px 5px; border-bottom: 1px solid #344153; }
    .mt5-layout-sync { gap: 8px; font-size: 11px; color: #79d7b7; }
    #mt5-layout-sync[data-error="true"] { color: #f5c478; }
  </style>
  <script type="importmap">{"imports":{"@tradecanvas/chart/widget":"/vendor/chart/widget/index.js","@tradecanvas/core":"/vendor/core/index.js","@tradecanvas/commons":"/vendor/commons/index.js"}}</script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>TradeCanvas · MT5</h1>
      <span id="status" role="status">Đang kết nối MT5…</span>
      <span id="sessions-alert" role="status" hidden></span>
    </header>
    <div id="workspace">
      <div id="chart" aria-label="Biểu đồ nến MetaTrader 5"></div>
    </div>
  </main>
  <dialog id="sessions-dialog" aria-labelledby="sessions-title">
    <h2 id="sessions-title">All-In-One Sessions</h2>
    <form id="sessions-form"></form>
    <p>Phiên và mức tùy chỉnh dùng giờ trong cài đặt. Với Forex, đoạn mở cửa Chủ nhật được gộp vào thứ Hai. Các mức dùng dữ liệu nến MT5.</p>
    <footer>
      <button id="sessions-cancel" type="button">Hủy</button>
      <button id="sessions-save" type="button">Áp dụng</button>
    </footer>
  </dialog>
</body>
</html>
